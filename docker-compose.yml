services:
  postgres:
    image: postgres:16-alpine
    container_name: scrollshield-postgres
    environment:
      POSTGRES_DB: scrollshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scrollshield-net

  redis:
    image: redis:7-alpine
    container_name: scrollshield-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scrollshield-net

  api-instance-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrollshield-api-1
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scrollshield
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTBOX_WEBHOOK_URL: ""
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scrollshield-net
    restart: unless-stopped

  api-instance-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrollshield-api-2
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scrollshield
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTBOX_WEBHOOK_URL: ""
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scrollshield-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  scrollshield-net:
    driver: bridge
