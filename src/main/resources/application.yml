spring:
  application:
    name: family-scroll-shield
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scrollshield}?sslmode=disable
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080

app:
  lease:
    heartbeat-interval-seconds: 30
    max-session-duration-seconds: 900
    grace-period-seconds: 15
  outbox:
    polling-interval-ms: 500
    batch-size: 100
    webhook-url: ${OUTBOX_WEBHOOK_URL:}
    max-retries: 5
    retry-backoff-ms: 1000

logging:
  level:
    com.family.scrollshield: DEBUG
